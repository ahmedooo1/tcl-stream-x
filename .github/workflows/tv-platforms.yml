# StreamX for Samsung (Tizen) and LG (webOS). Independent from build.yml: it never touches the
# Android app, its signing or its update releases (TV packages are workflow artifacts only).
# The repository is public, so anyone signed in to GitHub can download its workflow artifacts: the
# signed Samsung package is only ever uploaded encrypted, and never goes into a public release.
name: StreamX TV (Samsung, LG)

on:
  push:
    branches: [multiplatform-tv]
    paths: ['tv-platforms/**', '.github/workflows/tv-platforms.yml']
  pull_request:
    paths: ['tv-platforms/**', '.github/workflows/tv-platforms.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tv-platforms

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tv-platforms/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (parsers, Xtream, storage, guide, texts, player)
        run: npm test
      - name: Build both editions
        env:
          TV_BUILD: ${{ github.run_number }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tv-dist
          path: tv-platforms/dist
          retention-days: 7

  samsung:
    needs: test
    runs-on: ubuntu-24.04
    env:
      # Certificates made with Samsung Certificate Manager (docs/INSTALL-SAMSUNG.md), stored as
      # base64 in the repository secrets. Never written to the repository or the logs.
      HAS_CERTS: ${{ secrets.TIZEN_AUTHOR_P12 != '' && secrets.TIZEN_DISTRIBUTOR_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tv-dist
          path: tv-platforms/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Says which certificate secrets this run can read (yes / no only, never a value).
      - name: Certificate secrets visible to this run
        env:
          A: ${{ secrets.TIZEN_AUTHOR_P12 }}
          AP: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          D: ${{ secrets.TIZEN_DISTRIBUTOR_P12 }}
          DP: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
          K: ${{ secrets.TIZEN_ARTIFACT_PASSPHRASE }}
        run: |
          for v in A:TIZEN_AUTHOR_P12 AP:TIZEN_AUTHOR_PASSWORD D:TIZEN_DISTRIBUTOR_P12 DP:TIZEN_DISTRIBUTOR_PASSWORD K:TIZEN_ARTIFACT_PASSPHRASE; do
            n=${v%%:*}; [ -n "${!n}" ] && echo "::notice::${v#*:}: present" || echo "::warning::${v#*:}: missing for this run"
          done
      - name: Unsigned package (always)
        run: |
          mkdir -p out
          (cd dist/samsung && zip -qr ../../out/StreamX-Samsung-unsigned.zip .)
      - name: Tizen CLI
        if: env.HAS_CERTS == 'true'
        run: |
          set -e
          V=6.1
          curl -fsSL -o "$RUNNER_TEMP/cli.bin" "https://download.tizen.org/sdk/Installer/tizen-studio_${V}/web-cli_Tizen_Studio_${V}_ubuntu-64.bin"
          chmod +x "$RUNNER_TEMP/cli.bin"
          "$RUNNER_TEMP/cli.bin" --accept-license "$HOME/tizen-studio"
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -qq --no-install-recommends gnome-keyring dbus-x11 libsecret-1-0 > /dev/null
      - name: Sign StreamX-Samsung.wgt and encrypt it
        if: env.HAS_CERTS == 'true'
        env:
          AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12 }}
          AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          AUTHOR_CA: ${{ secrets.TIZEN_AUTHOR_CA }}
          DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12 }}
          DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
          DISTRIBUTOR_CA: ${{ secrets.TIZEN_DISTRIBUTOR_CA }}
          WGT_PASSPHRASE: ${{ secrets.TIZEN_ARTIFACT_PASSPHRASE }}
        run: |
          set -e
          if [ -z "$WGT_PASSPHRASE" ]; then
            echo "::error::TIZEN_ARTIFACT_PASSPHRASE is not set: refusing to sign, the package must not be uploaded in clear."
            exit 1
          fi
          # On Linux the Tizen CLI reads profile passwords from a keyring: one in memory, for this step.
          eval "$(dbus-launch --sh-syntax)"
          printf '\n' | gnome-keyring-daemon --unlock --components=secrets > /dev/null
          K="$RUNNER_TEMP/keys"; mkdir -p "$K"; chmod 700 "$K"
          printf '%s' "$AUTHOR_P12" | base64 -d > "$K/author.p12"
          printf '%s' "$DISTRIBUTOR_P12" | base64 -d > "$K/distributor.p12"
          EXTRA=()
          if [ -n "$AUTHOR_CA" ]; then printf '%s' "$AUTHOR_CA" | base64 -d > "$K/author-ca.cer"; EXTRA+=(-c "$K/author-ca.cer"); fi
          if [ -n "$DISTRIBUTOR_CA" ]; then printf '%s' "$DISTRIBUTOR_CA" | base64 -d > "$K/distributor-ca.cer"; EXTRA+=(-dc "$K/distributor-ca.cer"); fi
          tizen security-profiles add -n StreamXCI -a "$K/author.p12" -p "$AUTHOR_PASSWORD" \
            -d "$K/distributor.p12" -dp "$DISTRIBUTOR_PASSWORD" "${EXTRA[@]}" > /dev/null
          rm -rf "$RUNNER_TEMP/pkg"; cp -r dist/samsung "$RUNNER_TEMP/pkg"
          tizen package -t wgt -s StreamXCI -o "$RUNNER_TEMP/wgt" -- "$RUNNER_TEMP/pkg"
          S="$RUNNER_TEMP/signed"; mkdir -p "$S" signed
          mv "$RUNNER_TEMP"/wgt/*.wgt "$S/StreamX-Samsung.wgt"
          unzip -l "$S/StreamX-Samsung.wgt" | grep -E 'author-signature.xml|signature1.xml'
          # AES-256-GCM (tools/wgt-seal.mjs), proved decryptable here before anything is uploaded.
          node tools/wgt-seal.mjs seal "$S/StreamX-Samsung.wgt" signed/StreamX-Samsung.wgt.enc
          node tools/wgt-seal.mjs unseal signed/StreamX-Samsung.wgt.enc "$S/check.wgt"
          cmp "$S/StreamX-Samsung.wgt" "$S/check.wgt"
          rm -rf "$S" "$K" "$HOME/tizen-studio-data/profile"
          ls -la signed
      - name: No certificates yet
        if: env.HAS_CERTS != 'true'
        run: |
          echo "::warning::TIZEN_AUTHOR_P12 / TIZEN_DISTRIBUTOR_P12 are not set: only StreamX-Samsung-unsigned.zip is built. A Samsung TV installs signed packages only (docs/INSTALL-SAMSUNG.md)."
      - name: No signed package in clear
        run: |
          if find out signed -iname '*.wgt' 2>/dev/null | grep .; then
            echo "::error::a clear .wgt would be uploaded"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: StreamX-Samsung
          path: tv-platforms/out/*
          retention-days: 30
      # Encrypted with TIZEN_ARTIFACT_PASSPHRASE. The release job below never publishes it.
      - uses: actions/upload-artifact@v4
        if: env.HAS_CERTS == 'true'
        with:
          name: StreamX-Samsung-signed
          path: tv-platforms/signed/StreamX-Samsung.wgt.enc
          if-no-files-found: error
          retention-days: 30

  # Manual run only. Proves the Linux CLI, signing and sealing without any secret or real
  # certificate: a throwaway author key, the public Tizen distributor. Uploads nothing.
  samsung-signing-check:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tv-dist
          path: tv-platforms/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tizen CLI
        run: |
          set -e
          V=6.1
          curl -fsSL -o "$RUNNER_TEMP/cli.bin" "https://download.tizen.org/sdk/Installer/tizen-studio_${V}/web-cli_Tizen_Studio_${V}_ubuntu-64.bin"
          chmod +x "$RUNNER_TEMP/cli.bin"
          "$RUNNER_TEMP/cli.bin" --accept-license "$HOME/tizen-studio"
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -qq --no-install-recommends gnome-keyring dbus-x11 libsecret-1-0 > /dev/null
      - name: Sign with a throwaway key, seal, unseal
        run: |
          set -e
          # On Linux the Tizen CLI reads profile passwords from a keyring: one in memory, for this step.
          eval "$(dbus-launch --sh-syntax)"
          printf '\n' | gnome-keyring-daemon --unlock --components=secrets > /dev/null
          T="$RUNNER_TEMP/check"; mkdir -p "$T/keys"
          PW=$(openssl rand -hex 16); echo "::add-mask::$PW"
          tizen certificate -a StreamXCheck -p "$PW" -f check -- "$T/keys"
          tizen security-profiles add -n StreamXCheck -a "$T/keys/check.p12" -p "$PW"
          cp -r dist/samsung "$T/pkg"
          tizen package -t wgt -s StreamXCheck -o "$T/wgt" -- "$T/pkg"
          W=$(ls "$T"/wgt/*.wgt)
          unzip -l "$W" | grep -E 'author-signature.xml|signature1.xml'
          export WGT_PASSPHRASE="$PW"
          node tools/wgt-seal.mjs seal "$W" "$T/p.enc"
          node tools/wgt-seal.mjs unseal "$T/p.enc" "$T/p.wgt"
          cmp "$W" "$T/p.wgt"
          echo "signing and sealing ok"
      - name: Tizen CLI log (throwaway key only)
        if: failure()
        run: tail -n 60 "$HOME/tizen-studio-data/cli/logs/cli.log" || true

  lg:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: tv-dist
          path: tv-platforms/dist
      - name: StreamX-LG.ipk
        run: |
          set -e
          mkdir -p out
          npx --yes -p @webos-tools/cli@3.2.6 ares-package dist/lg -o "$RUNNER_TEMP/ipk"
          mv "$RUNNER_TEMP"/ipk/*.ipk out/StreamX-LG.ipk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: StreamX-LG
          path: tv-platforms/out/StreamX-LG.ipk
          retention-days: 30

  # Both editions in real Chrome from file://, remote keys only, with a generated playlist of
  # 50 000 entries: screenshots and timings. Not a test on a TV (no TV engine, no TV decoder).
  e2e:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tv-platforms/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: tv-dist
          path: tv-platforms/dist
      - name: Samsung build in Chrome
        run: node tools/e2e.mjs samsung 50000 e2e-out
      - name: LG build in Chrome
        run: node tools/e2e.mjs lg 50000 e2e-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StreamX-TV-screenshots
          path: tv-platforms/e2e-out
          retention-days: 30

  # Public download links: a pre-release "tv-build-N". GitHub never marks a pre-release as the
  # "latest" release, which is the only one the Android updater reads.
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [samsung, lg, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publish tv-build-${{ github.run_number }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: tv-build-${{ github.run_number }}
        run: |
          set -e
          # Named folders only: never the StreamX-Samsung-signed artifact.
          files=(art/StreamX-LG/StreamX-LG.ipk art/StreamX-Samsung/*)
          for f in "${files[@]}"; do
            case "$f" in *.ipk|*-unsigned.zip) ;; *) echo "::error::refusing to publish $f"; exit 1 ;; esac
          done
          {
            echo "StreamX TV, build ${{ github.run_number }} (branch ${{ github.ref_name }}, ${GITHUB_SHA::7})."
            echo
            echo "- StreamX-LG.ipk: installable on an LG TV in developer mode (docs/INSTALL-LG.md)."
            echo "- StreamX-Samsung-unsigned.zip: NOT installable as is. Sign it with your Samsung certificate profile (docs/INSTALL-SAMSUNG.md)."
            echo
            echo "Tested automatically (unit tests, Chrome from file://). Not yet tested on a real TV."
          } > NOTES.md
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "StreamX TV build ${{ github.run_number }}" --notes-file NOTES.md --prerelease --latest=false \
            || gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
