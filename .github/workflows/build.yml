name: Build, test and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check built-in channels (manifest + segment of every candidate)
        run: |
          COUNTRY=$(curl -s --max-time 5 https://ipinfo.io/country || echo "?")
          python3 tools/build_catalog.py --check --checked-from "GitHub Actions runner, country ${COUNTRY}"
          cat catalog/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Probe other sources (open films, sports API, Internet Archive, XMLTV)
        run: python3 tools/probe_sources.py || echo "::warning::source probe failed"

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --continue 2>&1 | tee unit.log
      - name: Report unit test failures
        if: steps.unit.outcome == 'failure'
        run: |
          grep -E "^e: |error:" unit.log | head -40 | while read -r l; do echo "::error::$l"; done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fl in list(tc.findall("failure")) + list(tc.findall("error")):
                      print(f"::error::{tc.get('classname','').split('.')[-1]}.{tc.get('name')}: {(fl.get('message') or '')[:300]}")
          PY

      - name: Build debug APK and test APK
        id: build
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk TCLStreamX-debug.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on an Android TV emulator (real streams, D-pad tour, 50k import)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash tools/ci_emulator_tests.sh

      - name: Summarize
        if: always()
        run: |
          python3 tools/ci_summary.py
          cat RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          cat ci-out/instrumented-status.txt 2>/dev/null || true

      - name: Publish release
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(TCLStreamX-debug.apk RESULTS.md catalog/REPORT.md catalog/SOURCES_REPORT.md app/src/main/assets/catalog.json ci-out/*.json ci-out/*.png ci-out/*.txt)
          gh release create "build-${BUILD_NUMBER}" "${files[@]}" \
            --title "TCL Stream X build ${BUILD_NUMBER}" \
            --notes-file RESULTS.md \
            --prerelease

      - name: Fail if tests failed
        if: always()
        run: |
          [ "${{ steps.unit.outcome }}" = "success" ] || { echo "unit tests failed"; exit 1; }
          [ "$(cat ci-out/instrumented-status.txt 2>/dev/null || echo 1)" = "0" ] || { echo "instrumented tests failed"; exit 1; }
