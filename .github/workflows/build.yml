name: Build, test and release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_level:
        description: "Android API level of the test emulator (30 = Android 11, 34 = Android 14)"
        default: "30"
      target:
        description: "Emulator image: android-tv or google_apis"
        default: "android-tv"
      arch:
        description: "x86 for android-tv 30, x86_64 for google_apis"
        default: "x86"
  # Full check (channels, sources, emulator) once a day; a push only builds and runs unit tests.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: the ubuntu-latest migration to Ubuntu 26 broke emulator boots (builds 3 and 4).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # Fast build on push (about 5 min). Full run: manual, nightly, or a commit message containing [full].
      FULL: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[full]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check built-in channels (manifest + segment of every candidate)
        if: env.FULL == 'true'
        run: |
          COUNTRY=$(curl -s --max-time 5 https://ipinfo.io/country || echo "?")
          if ! python3 tools/build_catalog.py --check --checked-from "GitHub Actions runner, country ${COUNTRY}" > catalog.log 2>&1; then
            tail -25 catalog.log | while read -r l; do echo "::error::$l"; done
            echo "::error::catalog check failed, the APK keeps the committed (unchecked) catalog"
          fi
          cat catalog.log
          cat catalog/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Probe other sources (open films, sports API, Internet Archive, XMLTV)
        if: env.FULL == 'true'
        run: |
          python3 tools/probe_sources.py > probe.log 2>&1 || tail -15 probe.log | while read -r l; do echo "::warning::$l"; done

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --continue 2>&1 | tee unit.log
      - name: Report unit test failures
        if: steps.unit.outcome == 'failure'
        run: |
          grep -E "^e: |error:" unit.log | head -40 | while read -r l; do echo "::error::$l"; done
          { grep -E "FAILED" unit.log; grep -A8 "What went wrong" unit.log; } | grep -v "^> Task" | head -30 | while read -r l; do echo "::error::unit: $l"; done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fl in list(tc.findall("failure")) + list(tc.findall("error")):
                      print(f"::error::{tc.get('classname','').split('.')[-1]}.{tc.get('name')}: {(fl.get('message') or '')[:300]}")
          PY

      - name: Build release APK and test APK
        id: build
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease assembleReleaseAndroidTest 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk StreamX.apk
          # Same file under the old name: build 45 and earlier look for this name when updating.
          cp StreamX.apk TCLStreamX-debug.apk

      # The old debug key (app/debug.keystore) became public with the repository. Builds are signed
      # with a private key kept in the repository secrets, with an APK v3 proof of rotation from the
      # old key: they install over older builds without losing data, and the old key can no longer
      # sign an update for a device that installed a rotated build. Without the secrets the build
      # keeps the old key, so nothing breaks before they are added.
      - name: Sign with the private release key (rotation from the old key)
        env:
          NEW_KS: ${{ secrets.STREAMX_KEYSTORE_B64 }}
          NEW_PASS: ${{ secrets.STREAMX_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$NEW_KS" ] || [ -z "$NEW_PASS" ]; then
            echo "::warning::STREAMX_KEYSTORE_B64 / STREAMX_KEYSTORE_PASSWORD secrets missing: APK signed with the old public key"
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # Pasted secrets may carry spaces or line breaks.
          NEW_PASS=$(printf '%s' "$NEW_PASS" | tr -d '\r\n')
          export NEW_PASS
          NEW_KS=$(printf '%s' "$NEW_KS" | tr -d ' \r\n')
          printf '%s' "$NEW_KS" | base64 -d > "$RUNNER_TEMP/new.jks" 2>/dev/null || true
          run() {
            if ! "$@" > "$RUNNER_TEMP/sign.log" 2>&1; then
              echo "::error::$(basename "$1") failed: $(tail -c 1500 "$RUNNER_TEMP/sign.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
              exit 1
            fi
            cat "$RUNNER_TEMP/sign.log"
          }
          # A wrong or truncated secret must not stop the releases: the APK keeps the old key and the run says why.
          if ! keytool -list -keystore "$RUNNER_TEMP/new.jks" -storepass "$NEW_PASS" > /dev/null 2>&1; then
            echo "::warning::release key not usable (keystore secret ${#NEW_KS} characters, expected 1352; password ${#NEW_PASS}, expected 24): APK signed with the old key"
            exit 0
          fi
          OLD="--ks app/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android"
          NEW="--ks $RUNNER_TEMP/new.jks --ks-pass env:NEW_PASS --ks-key-alias streamx --key-pass env:NEW_PASS"
          run "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage.bin" --old-signer $OLD --new-signer $NEW
          run "$BT/apksigner" sign $OLD --next-signer $NEW --lineage "$RUNNER_TEMP/lineage.bin" --rotation-min-sdk-version 28 \
            --out StreamX.apk app/build/outputs/apk/release/app-release.apk
          run "$BT/apksigner" verify -v --print-certs StreamX.apk
          echo "::notice::signing ($(basename "$BT")): $(grep -E 'Verified using v3|certificate SHA-256' "$RUNNER_TEMP/sign.log" | tr '\n' ' ' | cut -c1-900)"
          # The emulator tests install these two files: the test APK must carry the app's current key.
          cp StreamX.apk app/build/outputs/apk/release/app-release.apk
          cp StreamX.apk TCLStreamX-debug.apk
          run "$BT/apksigner" sign $NEW app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          rm -f "$RUNNER_TEMP/new.jks"

      - name: Publish APK early (tests results are attached later to the same release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes are limited to 125 000 characters: the full channel report is attached as a file.
          head -n 6 catalog/REPORT.md > EARLY.md
          # A re-run of the same build reuses its release instead of failing on the existing tag.
          gh release create "build-${BUILD_NUMBER}" StreamX.apk TCLStreamX-debug.apk catalog/REPORT.md \
            --title "StreamX build ${BUILD_NUMBER}" --notes-file EARLY.md --prerelease \
            || gh release upload "build-${BUILD_NUMBER}" StreamX.apk TCLStreamX-debug.apk catalog/REPORT.md --clobber

      - name: Enable KVM
        if: env.FULL == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner image no longer ships the audio library the emulator binary links against
      # (diagnosed: "libpulse.so.0: cannot open shared object file"), and its disk is ~96 % full.
      - name: Emulator host libraries and disk space
        if: env.FULL == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libgl1 libxdamage1 libxkbfile1 >/dev/null
          "$ANDROID_HOME/emulator/emulator" -version | head -1
          echo "::notice::emulator check: $("$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tr '\n' ' ') | disk free: $(df -h / | tail -1 | awk '{print $4}')"

      - name: Instrumented tests on an Android TV emulator (real streams, D-pad tour, 50k import)
        id: emu1
        if: env.FULL == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '30' }}
          target: ${{ inputs.target || 'android-tv' }}
          arch: ${{ inputs.arch || 'x86' }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/ci_emulator_tests.sh

      # When the Android TV image does not boot on the runner, the same tests run on the standard
      # Google APIs image (x86_64), which GitHub runners boot reliably; device.txt records which one ran.
      - name: Retry emulator tests once (Google APIs x86_64 image)
        if: env.FULL == 'true' && steps.emu1.outcome == 'failure' && hashFiles('ci-out/instrumented-status.txt') == ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '30' }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/ci_emulator_tests.sh

      # Runner logs are not readable from the development environment, so boot problems are reported as annotations.
      - name: Emulator diagnostics (only when no emulator booted)
        if: always() && env.FULL == 'true' && steps.build.outcome == 'success' && hashFiles('ci-out/instrumented-status.txt') == ''
        continue-on-error: true
        run: |
          EMU="$ANDROID_HOME/emulator/emulator"
          note() { printf '::warning::%s\n' "$(printf '%s' "$1" | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; }
          note "kvm: $(ls -l /dev/kvm 2>&1) | groups: $(id) | nproc $(nproc) | mem $(free -m | awk '/Mem/{print $2}') MB | disk $(df -h / | tail -1)"
          note "emulator: $($EMU -version 2>&1 | head -2) | accel: $($EMU -accel-check 2>&1)"
          note "avds: $($EMU -list-avds 2>&1) | images: $(ls $ANDROID_HOME/system-images/*/* 2>&1 | tr '\n' ' ')"
          AVD=$($EMU -list-avds 2>/dev/null | tail -1)
          if [ -n "$AVD" ]; then
            ( timeout 240 "$EMU" -avd "$AVD" -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -verbose > emu.log 2>&1 & )
            sleep 200
            note "adb: $(adb devices 2>&1) | boot_completed=$(adb shell getprop sys.boot_completed 2>&1)"
            note "emulator log (errors): $(grep -iE 'error|fail|fatal|cannot|unable|kvm|hax|panic' emu.log | head -40)"
            note "emulator log (tail): $(tail -40 emu.log)"
          fi

      - name: Summarize
        if: always()
        run: |
          python3 tools/ci_summary.py
          cat RESULTS.md >> "$GITHUB_STEP_SUMMARY"
          cat ci-out/instrumented-status.txt 2>/dev/null || true

      - name: Publish release
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=()
          for f in RESULTS.md catalog/REPORT.md catalog/SOURCES_REPORT.md app/src/main/assets/catalog.json ci-out/*.json ci-out/*.png ci-out/*.jpg ci-out/*.txt; do
            [ -f "$f" ] && files+=("$f")
          done
          gh release upload "build-${BUILD_NUMBER}" "${files[@]}" --clobber
          gh release edit "build-${BUILD_NUMBER}" --notes-file RESULTS.md

      - name: Fail if tests failed
        if: always()
        run: |
          [ "${{ steps.unit.outcome }}" = "success" ] || { echo "unit tests failed"; exit 1; }
          if [ "$FULL" = "true" ]; then
            [ "$(cat ci-out/instrumented-status.txt 2>/dev/null || echo 1)" = "0" ] || { echo "instrumented tests failed"; exit 1; }
          fi

      # Only a build whose tests all passed becomes the "latest" release, which the in-app updater offers.
      - name: Mark as latest release (tests passed)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "build-${BUILD_NUMBER}" --prerelease=false --latest
