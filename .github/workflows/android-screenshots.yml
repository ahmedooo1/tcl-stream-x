# Screenshots of the Android app (unchanged) on an Android TV emulator, to compare with StreamX
# Samsung and StreamX LG. Separate from build.yml: no signing step, no release, no "latest" change,
# nothing written to the repository. Artifact only.
name: Android screenshots (comparison with the TV editions)

on:
  workflow_dispatch:
  push:
    branches: [multiplatform-tv]
    paths: ['.github/workflows/android-screenshots.yml', 'tv-platforms/tools/android_screens.sh']

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app and its UI test (Gradle's own signing, as configured in the project)
        run: ./gradlew --no-daemon assembleRelease assembleReleaseAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator host libraries
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libgl1 libxdamage1 libxkbfile1 >/dev/null
      - name: UI tour on the Android TV emulator
        id: tv
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tv-platforms/tools/android_screens.sh
      - name: Retry on the Google APIs image
        if: steps.tv.outcome == 'failure' && hashFiles('android-shots/*.png') == ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tv-platforms/tools/android_screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-TV-screenshots
          path: android-shots
          retention-days: 30
